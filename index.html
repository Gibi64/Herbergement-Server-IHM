<script>
var g_szBackGroundColor = "#BBCFE0";
var g_ServerUrl = "http://127.0.0.1:8080";
var g_szPageName = "Volets-arrosage";
var g_szBackGroundColor = g_szBackGroundColor || "#000000";
var JacquesPainter = {
    ArrayOfBlinkingActions: [],
    blinkState: true,
    Actions: {
        "html": function (szId, szKey, args) {
            var layer = document.querySelector('.event-layer');
            var old = document.getElementById(szId);
            if (old) old.parentNode.removeChild(old);
            JacquesPainter.executeHTML(layer, args[0], szId);
        },
        "canvas": function (szId, szKey, args) {
            var ctx = JacquesPainter.getCanvasContext();
            if (ctx) {
                var numericArgs = args.map(attr => (!isNaN(attr) && attr.trim() !== "") ? Number(attr) : attr);
                JacquesPainter.executeCanvas(ctx, szKey, numericArgs);
            }
        },
        "sys": function (szId, szKey, args) {
            if (szKey === 'LastIndex') {
                currentLastIndex = Number(args[0]);
                // log du lastIndex pour debug
                //console.log("Mise à jour du LastIndex :", currentLastIndex);
            }
            else if (szKey === 'Font')
            {
                // log du Font
                console.log("Mise à jour du Font :", args[0]);
                g_CurrentFont = args[0];
            }
            // Le blink est géré par le flux du Dispatcher, pas par le rendu sys
        }
    },
    isBetweenQuotes: function (s, pos) {
        let n = 0, i = 0;
        while (true) {
            i = s.indexOf('"', i);
            if (i === -1 || i > pos) break;
            n++; i++;
        }
        return n % 2 === 1;
    },

    getCanvasContext: function () {
        var canvas = document.getElementById('MainFlowsheet');
        return canvas ? canvas.getContext('2d') : null;
    },
    ClearObject: function (szId) {
        // 1. On cherche la métadonnée "rectangle" dans le bloc sys
        var rectAction = this.ArrayOfBlinkingActions.find(item =>
            item.id === szId && item.action.key === "rectangle"
        );

        if (rectAction) {
            var r = rectAction.action.args;
            var x1 = Number(r[0]);
            var y1 = Number(r[1]);
            var x2 = Number(r[2]);
            var y2 = Number(r[3]);
            var width = x2 - x1;
            var height = y2 - y1;

            console.log("ID:", szId, " | Gommage Rect:", r[0], r[1], r[2], r[3]);
            // --- CAS CANVAS ---
            var ctx = this.getCanvasContext();
            if (ctx) {
                ctx.fillStyle = g_szBackGroundColor;
                ctx.fillRect(x1, y1, width, height);
            }

            // --- CAS HTML ---
            // Si l'objet est un DIV, on n'efface pas, on cache.
            var el = document.getElementById(szId);
            if (el) {
                el.style.visibility = 'hidden';
            }
        }
    },
    DrawAction: function (szId, action) {
        var ctx = this.getCanvasContext();
        if (ctx && action.translator === "canvas") {
            this.executeCanvas(ctx, action.key, action.args);
        }
    },
    dispatchTranslate: function (szId, szKey, vectorAttributes, szTranslator) {
        // Appel direct via la matrice : pas de tests, pas de verrues
        var fn = this.Actions[szTranslator];
        if (fn) {
            fn(szId, szKey, vectorAttributes);
        }
    },
    transportParser: function (s) {
        if (!s) return;
        let vectorAttributes = [];
        let szId = "", szKey = "";

        // Nettoyage rapide des blancs hors quotes
        let clean = "";
        for (let i = 0; i < s.length; i++) {
            if ((s[i] === ' ' || s[i] === '\n' || s[i] === '\r') && !this.isBetweenQuotes(s, i)) continue;
            clean += s[i];
        }
        s = clean;

        while (s.length > 0) {
            if (s.substring(0, 4) !== "<Id=") return 1;
            s = s.substring(4);
            let iVirg = s.indexOf(',');
            szId = s.substring(0, iVirg);
            s = s.substring(iVirg + 1);
            let bMapBlinking = false;
            while (true) {
                vectorAttributes = [];
                if (s[0] !== '[') break;
                s = s.substring(1);

                let iCommaKey = s.indexOf(',');
                szKey = s.substring(0, iCommaKey);
                let position = iCommaKey + 1;

                if (s[position] !== '{') return 1;
                position++;

                let iClosingCurly = s.indexOf('}', position);
                let subPos = position;
                while (subPos < iClosingCurly) {
                    let iComma = s.indexOf(',', subPos);
                    let attrEnd = (iComma !== -1 && !this.isBetweenQuotes(s, iComma) && iComma < iClosingCurly)
                        ? iComma : iClosingCurly;

                    let attribute = s.substring(subPos, attrEnd);
                    if (attribute.startsWith('"') && attribute.endsWith('"')) {
                        attribute = attribute.substring(1, attribute.length - 1);
                    }
                    vectorAttributes.push(attribute);

                    if (attrEnd === iClosingCurly) break;
                    subPos = attrEnd + 1;
                }

                position = iClosingCurly + 1;
                if (s[position] === ',') position++;

                let iBrackets = s.indexOf(']', position);
                let translator = s.substring(position, iBrackets);

                // LE PARSER FAIT SON BOULOT : IL APPELLE LE DISPATCH
                if (szKey === "blink") {
                    if (vectorAttributes[0] === "on") bMapBlinking = true;
                    else {
                        this.ArrayOfBlinkingActions = this.ArrayOfBlinkingActions.filter(item => item.id !== szId);
                        bMapBlinking = false;
                    }
                }

                if (bMapBlinking && szKey !== "blink")
                {
                    this.ArrayOfBlinkingActions.push({
                        id: szId,
                        action: { key: szKey, args: [...vectorAttributes], translator: translator }
                    });
                } else
                {
                    // ON APPELLE TOUJOURS DISPATCH (même pour blink, car il sait gérer)
                    this.dispatchTranslate(szId, szKey, vectorAttributes, translator);
                }
                position = iBrackets + 1;
                if (s[position] === '>')
                {
                    if (szKey === "blink" && vectorAttributes[0] === "off")
                    {
                        // Nettoyage : on filtre le vecteur pour retirer cet ID
                        this.ArrayOfBlinkingActions = this.ArrayOfBlinkingActions.filter(item => item.id !== szId);
                    }

                    s = s.substring(position + 1);
                    break;
                }
                else if (s[position] === ',')
                {
                    s = s.substring(position + 1);
                }
                else
                {
                    break;
                }
            }
        }
    },

    executeCanvas: function (ctx, action, args) {
        if (typeof ctx[action] === 'function') {
            if (!args || args.length === 0) {
                ctx[action]();
            } else {
                ctx[action].apply(ctx, args);
            }
        } else {
            ctx[action] = args[0];
        }
    },

    executeHTML: function (container, html, szId) {
        if (container && html) {
            var wrapper = document.createElement('div');
            wrapper.id = szId;
            wrapper.style.display = 'inline-block';
            wrapper.innerHTML = html.trim();
            container.appendChild(wrapper);
        }
    },

    renderInitial: function (canvasId, soute) {
        if (!soute) return;
        this.transportParser(soute);
    }
};
function updateFromJournal() {
    const SERVER_URL = g_ServerUrl;
    const PAGE_TO_INFORM = g_szPageName;

    const xml =
        `<Command Method="Events"
                  LastIndex="${currentLastIndex}"
                  Page="${PAGE_TO_INFORM}"/>`;

    const encoded = btoa(xml);

    fetch(SERVER_URL + "/" + encoded, { method: 'GET' })

        .then(function (res) {
            return res.text();
        })

        .then(function (rawString) {

            console.log("Flux brut reçu :", rawString);

            if (rawString && rawString.trim().length > 0) {
                JacquesPainter.transportParser(rawString);
            }

            setTimeout(updateFromJournal, 100);
        })

        .catch(function (err) {
            console.error("Erreur Fetch dynamique:", err);
            setTimeout(updateFromJournal, 1000);
        });
} function startProto() {
    console.log("Démarrage du Live..."); // Pour être sûr que startProto se lance

    var s = document.getElementById('MainData');
    if (s) {
        var d = s.getAttribute('CommandDataSet');
        JacquesPainter.renderInitial('MainFlowsheet', d);
    }

    // ON DÉPLACE LE MÉTRONOME ICI
    console.log("Lancement du Timer de clignotement...");
    setInterval(function () {
        JacquesPainter.blinkState = !JacquesPainter.blinkState;
        //console.log("Blink Tick - Etat:", JacquesPainter.blinkState, "Nb actions:", JacquesPainter.ArrayOfBlinkingActions.length);
        // On garde une trace des IDs déjà effacés pour ne pas gommer 10 fois le même rect
        let clearedIds = {};

        JacquesPainter.ArrayOfBlinkingActions.forEach(function (item) {
            if (JacquesPainter.blinkState) {
                // PHASE DESSIN : On dessine TOUTES les actions
                JacquesPainter.DrawAction(item.id, item.action);
            } else {
                // PHASE GOMMAGE : On n'efface qu'une seule fois par ID
                if (!clearedIds[item.id]) {
                    JacquesPainter.ClearObject(item.id);
                    clearedIds[item.id] = true;
                }
            }
        });
    }, 500);
   updateFromJournal();
}
///////////////////////////////////////// Main ///////////////////////////////////////////////
document.addEventListener('DOMContentLoaded', startProto);
// On récupère le conteneur graphique une fois pour toutes
const g_Container = document.getElementById('synoptique-container');
const g_Canvas = document.getElementById('MainFlowsheet');
var currentLastIndex = 0;
let g_jsShiftActive = "0";
let g_jsCtrlActive = "0";
let g_jsAltActive = "0";

let g_jsIsMouseDown = false;
g_CurrentFont = '';
// Enregistrement des vecteurs d'IRQ
document.addEventListener('mousedown', OnMouseDown);
document.addEventListener('mouseup', OnMouseUp);
document.addEventListener('mousemove', OnMouseMove);
document.addEventListener('dblclick', OnDoubleClick);
document.addEventListener('keydown', OnKeyDown);
document.addEventListener('keypress', OnChar); 
document.addEventListener('keyup', OnKeyUp);
////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Fonction magique pour avoir les vraies coordonnées (X, Y) relatives au Canvas
function GetRelativeCoords(event) {
    if (!g_Container) return { x: event.clientX, y: event.clientY };
    let rect = g_Container.getBoundingClientRect();
    return {
        x: Math.round(event.clientX - rect.left),
        y: Math.round(event.clientY - rect.top)
    };
}

// Fonction universelle d'envoi d'IRQ (La norme stricte)
function SendIRQ(xmlString) {
    let encoded = btoa(xmlString);
    fetch(g_ServerUrl + "/" + encoded, { method: 'GET' });
}

// Dans jsContainer.js, on aligne les codes sur l'énumération C++ (1000 + x)
function OnMouseDown(event)
{
    g_jsIsMouseDown = true;
    let coords = GetRelativeCoords(event);
    let xml = `<Command Method="MouseDown" Id="0" X="${coords.x}" Y="${coords.y}" Page="${g_szPageName}"/>`;
    SendIRQ(xml);
}

function OnMouseUp(event)
{
    //let coords = GetRelativeCoords(event);
    //let xml = `<Command Method="MouseUp" Id="0" X="${coords.x}" Y="${coords.y}" Page="${g_szPageName}"/>`;
    //SendIRQ(xml);
    g_jsIsMouseDown = false;
}

function OnMouseMove(event)
{
    if (g_jsIsMouseDown)
    { // Uniquement si le clic gauche est maintenu (sélection)
        let coords = GetRelativeCoords(event);
        let xml = `<Command Method="MouseMove" Id="0" X="${coords.x}" Y="${coords.y}" Page="${g_szPageName}"/>`;
        SendIRQ(xml);
    }
}

function OnDoubleClick(event) {
    let coords = GetRelativeCoords(event);
    let xml = `<Command Method="DoubleClick" Id="0" X="${coords.x}" Y="${coords.y}" Page="${g_szPageName}"/>`;
    SendIRQ(xml);
}

function OnKeyDown(event)
{
    let asciiCode = event.keyCode || event.which;

    // 1. MISE À JOUR DE LA MÉMOIRE LOCALE (Touches d'état)
    // Si l'utilisateur appuie sur une touche système, on stocke l'état et ON ARRÊTE LA FONCTION (Pas de fetch !)
    if (event.key === "Shift") { g_jsShiftActive = "1"; return; }
    if (event.key === "Control") { g_jsCtrlActive = "1"; return; }
    if (event.key === "Alt") { g_jsAltActive = "1"; return; }

    // 2. ENVOI DE L'INTERRUPTION (Touches d'action : Flèches, Lettres, Backspace...)
    // Ici, on embarque la mémoire de l'état actuel du clavier local
    let xml = `<Command Method="KeyDown" 
                        AsciiCode="${asciiCode}" 
                        Ctrl="${g_jsCtrlActive}" 
                        Shift="${g_jsShiftActive}" 
                        Alt="${g_jsAltActive}" 
                        Page="${g_szPageName}"/>`;
    SendIRQ(xml);

    // Blocage du comportement natif du navigateur pour les touches de navigation
    if (["ArrowLeft", "ArrowRight", "Delete", "Backspace", "Enter"].includes(event.key)) {
        event.preventDefault();
    }
}
function OnKeyUp(event)
{
    // 3. NETTOYAGE DE LA MÉMOIRE LOCALE (Au relâchement de la touche)
    // Dès que le doigt quitte la touche système, on remet à jour notre mémoire locale (Toujours aucun fetch)
    if (event.key === "Shift") { g_jsShiftActive = "0"; return; }
    if (event.key === "Control") { g_jsCtrlActive = "0"; return; }
    if (event.key === "Alt") { g_jsAltActive = "0"; return; }
}

function OnChar(event) {
    let asciiCode = event.charCode || event.which;

    if (!g_Canvas)
        return;
    
    let ctx = g_Canvas.getContext('2d');

    ctx.font = g_CurrentFont;
    ctx.textRendering = "geometricPrecision";
    ctx.imageSmoothingEnabled = false;

    let charSize = ctx.measureText(event.key).width;
// On envoie une valeur réelle pour ne faire l'arrondi que pour la valeur finale
    let ctrl = event.ctrlKey ? "1" : "0";
    let shift = event.shiftKey ? "1" : "0";
    let alt = event.altKey ? "1" : "0";

    let xml = `<Command Method="Char" AsciiCode="${asciiCode}" CharSize="${charSize}" Ctrl="${ctrl}" Shift="${shift}" Alt="${alt}" Page="${g_szPageName}"/>`;
    SendIRQ(xml);
}


</script>
